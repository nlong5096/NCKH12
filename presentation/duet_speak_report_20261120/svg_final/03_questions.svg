<g id="heading" data-pptx-bounds="56 24 1168 108"><text x="56" y="42" font-size="16" fill="#007F7A">01 · MỤC TIÊU VÀ CÂU HỎI NGHIÊN CỨU</text><text x="56" y="103" font-size="40" font-weight="bold" fill="#153448">Ba câu hỏi xác định ranh giới nghiên cứu</text></g>
<g id="rq1" data-pptx-bounds="56 181 1168 120"><text x="56" y="224" font-size="32" font-weight="bold" fill="#007F7A">RQ1</text><text x="190" y="223" font-size="30" font-weight="bold" fill="#153448">Học sinh nói ở đâu?</text><text x="190" y="270" fill="#203746">Căn chỉnh và định vị phần lời học sinh trong video Duet.</text><line x1="190" y1="298" x2="1224" y2="298" stroke="#C8D7DC" /></g>
<g id="rq2" data-pptx-bounds="56 323 1168 120"><text x="56" y="365" font-size="32" font-weight="bold" fill="#007F7A">RQ2</text><text x="190" y="364" font-size="30" font-weight="bold" fill="#153448">Điểm máy lệch bao nhiêu so với người đánh giá?</text><text x="190" y="411" fill="#203746">Đo sai lệch theo từng tiêu chí, kèm cỡ mẫu và mức tin cậy.</text><line x1="190" y1="440" x2="1224" y2="440" stroke="#C8D7DC" /></g>
<g id="rq3" data-pptx-bounds="56 465 1168 120"><text x="56" y="507" font-size="32" font-weight="bold" fill="#007F7A">RQ3</text><text x="190" y="506" font-size="30" font-weight="bold" fill="#153448">Còn cần kiểm chứng gì trước khi sử dụng?</text><text x="190" y="553" fill="#203746">Điều kiện dữ liệu, người chấm và giá trị của phản hồi luyện tập.</text></g>
<g id="teacher-role" data-pptx-bounds="190 600 1034 40"><text x="190" y="625" font-size="22" fill="#526875">Giáo viên đặt chuẩn, xem lại trường hợp bất định và quyết định phản hồi.</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="56 670 1168 28" fill="#526875" font-size="16"><text x="56" y="688">Nguồn: Báo cáo Word, Mở đầu §2–3</text><text x="1224" y="688" text-anchor="end">03 / 28</text></g>
