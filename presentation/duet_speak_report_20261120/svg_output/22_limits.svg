<g id="data-limit" data-pptx-bounds="56 196 1168 111"><text x="56" y="231" font-size="32" font-weight="bold" fill="#007F7A">01</text><text x="144" y="230" font-size="30" font-weight="bold" fill="#153448">Dữ liệu hẹp → chưa suy rộng</text><text x="144" y="277" fill="#203746">Một bài đọc T001; chưa kiểm chứng nhiều chủ đề, thiết bị và môi trường.</text></g>
<g id="reference-limit" data-pptx-bounds="56 332 1168 111"><text x="56" y="367" font-size="32" font-weight="bold" fill="#007F7A">02</text><text x="144" y="366" font-size="30" font-weight="bold" fill="#153448">Nhãn ít và hẹp → chưa xác nhận thang năng lực</text><text x="144" y="413" fill="#203746">12 + 3 bài, một người nghe có AI hỗ trợ; 18 bài giữ riêng chưa kiểm định cuối.</text></g>
<g id="education-limit" data-pptx-bounds="56 468 1168 111"><text x="56" y="503" font-size="32" font-weight="bold" fill="#007F7A">03</text><text x="144" y="502" font-size="30" font-weight="bold" fill="#153448">Chưa thử nghiệm sư phạm → chưa kết luận tiến bộ</text><text x="144" y="549" fill="#203746">Kiểm thử phần mềm không thay được đánh giá trước–sau hoặc nhóm so sánh.</text></g>
<g id="use-boundary" data-pptx-bounds="56 603 1168 43"><text x="56" y="630" font-size="22" fill="#946017">Dùng hỗ trợ luyện tập có giáo viên theo dõi; chưa dùng chấm chính thức hoặc quy đổi CEFR / IELTS.</text></g>
