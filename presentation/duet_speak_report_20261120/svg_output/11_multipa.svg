<g id="heading" data-pptx-bounds="56 24 1168 145"><text x="56" y="42" font-size="16" fill="#007F7A">02 · PRETRAINED MODEL VÀ HIỆU CHỈNH</text><text x="56" y="96" font-size="40" font-weight="bold" fill="#153448">MultiPA được tích hợp, hiệu chỉnh<tspan x="56" dy="48">trong miền quan sát</tspan></text></g>
<g id="model-method" data-pptx-bounds="56 200 610 364"><text x="56" y="239" font-size="30" font-weight="bold" fill="#153448">Không huấn luyện lại mô hình nền</text><text x="56" y="299" fill="#203746">Chia âm thanh gốc thành đoạn ≤14,5 s.<tspan x="56" dy="36">MultiPA pretrained tạo điểm thô.</tspan><tspan x="56" dy="36">Lấy trung bình không trọng số theo bài.</tspan></text><line x1="56" y1="412" x2="650" y2="412" stroke="#C8D7DC"/><text x="56" y="457" font-size="30" font-weight="bold" fill="#153448">LOOCV trên 12 bài phát triển</text><text x="56" y="512" fill="#203746">Mỗi lượt: hiệu chỉnh trên 11 bài,<tspan x="56" dy="36">dự đoán bài còn lại; lặp 12 lượt.</tspan></text></g>
<g id="observed-support" data-pptx-bounds="704 200 520 364"><rect x="704" y="200" width="520" height="364" fill="#EDF4F5"/><text x="730" y="239" font-size="30" font-weight="bold" fill="#153448">Miền điểm có nhãn</text><text x="730" y="305" fill="#203746">Phát âm · MultiPA Accuracy<tspan x="730" dy="38" fill="#007F7A" font-weight="bold">Chỉ quan sát mức 3 và 4</tspan></text><text x="730" y="409" fill="#203746">Trôi chảy · mô hình timing: mức 4–5</text><text x="730" y="469" fill="#203746">Ngữ điệu · MultiPA: mức 2–5</text><text x="730" y="535" font-size="22" fill="#946017">Không ngoại suy sang mức chưa quan sát.</text></g>
<g id="selection" data-pptx-bounds="56 591 1168 54"><text x="56" y="622" fill="#153448">Chọn phương pháp theo từng tiêu chí; <tspan font-weight="bold">mức dễ hiểu vẫn do người nghe đánh giá</tspan>.</text></g>
