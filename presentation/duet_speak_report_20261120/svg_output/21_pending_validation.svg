<g id="heading" data-pptx-bounds="56 24 1168 110"><text x="56" y="42" font-size="16" fill="#007F7A">04 · CẬP NHẬT THEO BÁO CÁO WORD</text><text x="56" y="103" font-size="40" font-weight="bold" fill="#153448">Kiểm định 68 bài đang thực hiện</text></g>
<g id="current-evidence" data-pptx-bounds="56 176 1168 145"><rect x="56" y="176" width="1168" height="145" fill="#EDF4F5"/><text x="80" y="218" font-size="30" font-weight="bold" fill="#153448">Đã chấm thêm 10 bài sau P2.5 theo báo cáo.</text><text x="80" y="269" fill="#203746">Chưa công bố bảng chỉ số; chưa có kết quả đồng thuận đầy đủ trên 68 bài.</text><text x="80" y="305" font-size="22" fill="#946017">Không chuyển nhận xét “tương đồng khá tốt” thành kết quả định lượng.</text></g>
<g id="validation-order" data-pptx-bounds="56 361 1168 130"><text x="56" y="397" font-size="30" font-weight="bold" fill="#007F7A">Khóa cấu hình</text><text x="417" y="397" font-size="30" font-weight="bold" fill="#007F7A">Giáo viên chấm mù</text><text x="844" y="397" font-size="30" font-weight="bold" fill="#007F7A">So sánh riêng hai tập</text><text x="56" y="447" font-size="22" fill="#203746">Không sửa sau khi xem điểm</text><text x="417" y="447" font-size="22" fill="#203746">Không xem điểm máy trước</text><text x="844" y="447" font-size="22" fill="#203746">Phát triển / 18 bài giữ riêng</text><line x1="56" y1="484" x2="1224" y2="484" stroke="#C8D7DC" stroke-width="2"/></g>
<g id="planned-metrics" data-pptx-bounds="56 522 1168 128"><text x="56" y="556" font-size="30" font-weight="bold" fill="#153448">Chỉ số dự kiến</text><text x="56" y="607" font-size="22" fill="#203746">Bias · MAE · cùng mức / lệch ≤1 · ICC(2,1) đồng thuận tuyệt đối · QWK<tspan x="56" dy="31">Pearson là chỉ số bổ sung; kết quả trên tập giữ riêng là bằng chứng chính.</tspan></text></g>
