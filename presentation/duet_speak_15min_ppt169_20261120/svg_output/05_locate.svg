<g id="heading" data-pptx-bounds="56 25 1168 115"><text x="56" y="44" font-size="16" fill="#007F7A">QUY TRÌNH · 2/4 TÌM LỜI · VÍ DỤ D043</text><text x="56" y="108" font-size="44" font-weight="bold" fill="#153448">Tìm đúng phần học sinh nói</text></g>
<g id="receive" data-pptx-bounds="56 195 320 205"><text x="56" y="219" font-size="24" font-weight="bold" fill="#007F7A">NHẬN GÌ?</text><rect x="56" y="243" width="320" height="157" fill="#EDF4F5" /><text x="80" y="293" font-size="32" font-weight="bold" fill="#153448">Hai video</text><text x="80" y="344" font-size="24" fill="#203746">Video mẫu<tspan x="80" dy="34">và bản Duet đã quay.</tspan></text></g>
<g id="do" data-pptx-bounds="445 195 386 205"><text x="445" y="219" font-size="24" font-weight="bold" fill="#007F7A">LÀM GÌ?</text><rect x="445" y="243" width="386" height="157" fill="#EDF4F5" /><text x="469" y="293" font-size="32" font-weight="bold" fill="#153448">So sánh với mẫu</text><text x="469" y="344" font-size="24" fill="#203746">Đặt khớp thời gian;<tspan x="469" dy="34">kiểm tra giọng mẫu còn lẫn.</tspan></text></g>
<g id="return" data-pptx-bounds="900 195 324 205"><text x="900" y="219" font-size="24" font-weight="bold" fill="#007F7A">TRẢ VỀ GÌ?</text><rect x="900" y="243" width="324" height="157" fill="#EDF4F5" /><text x="924" y="293" font-size="32" font-weight="bold" fill="#153448">Mốc lời học sinh</text><text x="924" y="344" font-size="24" fill="#203746">Các đoạn có thể<tspan x="924" dy="34">là tiếng người học.</tspan></text></g>
