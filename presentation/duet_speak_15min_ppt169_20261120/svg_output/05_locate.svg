<g id="output-edge" data-pptx-bounds="844 311 43 24"><line x1="846" y1="322" x2="885" y2="322" stroke="#007F7A" stroke-width="3" marker-end="url(#arrow)" /></g>
<g id="quality-paths" data-pptx-bounds="56 458 1168 115"><line x1="56" y1="458" x2="1224" y2="458" stroke="#C8D7DC" /><text x="56" y="509" font-weight="bold" fill="#007F7A">Đủ rõ → tiếp tục</text><text x="447" y="509" font-weight="bold" fill="#946017">Bất định → nghe lại</text><text x="899" y="509" font-weight="bold" fill="#A44242">Thiếu căn cứ → dừng</text><text x="56" y="565" font-size="24" fill="#526875">Hình ảnh và âm thanh cùng hỗ trợ; không ép mọi video phải có điểm.</text></g>
<g id="explanation" data-pptx-bounds="56 607 1168 39"><text x="56" y="635" fill="#153448">Biết video mẫu giúp giảm nguy cơ <tspan font-weight="bold">chấm nhầm lời mẫu</tspan>.</text></g>
