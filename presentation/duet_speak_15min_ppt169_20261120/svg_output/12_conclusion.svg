<g id="heading" data-pptx-bounds="56 25 1168 115"><text x="56" y="44" font-size="16" fill="#007F7A">KẾT LUẬN VÀ BƯỚC TIẾP THEO</text><text x="56" y="108" font-size="44" font-weight="bold" fill="#153448">Máy hỗ trợ đo, giáo viên quyết định</text></g>
<g id="three-answers" data-pptx-bounds="56 184 1168 229"><g font-size="24" font-weight="bold" fill="#007F7A"><text x="56" y="220">VẤN ĐỀ</text><text x="56" y="305">CÁCH LÀM</text><text x="56" y="390">ĐÃ ĐẠT</text></g><g fill="#153448"><text x="250" y="220">Nhiều bài luyện nói cần phản hồi cụ thể.</text><text x="250" y="305">Dùng mẫu tìm lời → phân tích giọng gốc → gợi ý.</text><text x="250" y="390">Nguyên mẫu hoạt động, bằng chứng có thể xem lại.</text></g></g>
<g id="next-step" data-pptx-bounds="56 455 1168 112"><line x1="56" y1="456" x2="1224" y2="456" stroke="#007F7A" stroke-width="3" /><text x="56" y="501" font-weight="bold" fill="#153448">Tiếp theo: chấm độc lập và kiểm định 18 bài giữ riêng.</text><text x="56" y="552" font-size="24" fill="#526875">Mở rộng dữ liệu, rồi đo giá trị của việc luyện tập; thu thập có sự đồng ý phù hợp.</text></g>
<g id="closing-takeaway" data-pptx-bounds="56 595 1168 57"><text x="56" y="633" font-size="36" font-weight="bold" fill="#007F7A">Xem lại bằng chứng. Luyện tiếp có định hướng.</text></g>
